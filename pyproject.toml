[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jaguartv-postmatch-video-factory"
version = "1.0.0"
description = "Auditable JaguarTV Task 2 post-match poster and video production pipeline"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jaguartv-postmatch = "jaguartv_postmatch.pipeline:main"
jaguartv-media-library = "jaguartv_postmatch.media_library:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
